<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Translator - Pi Web3</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #131c31;
            --card-border: #1e293b;
            --accent-blue: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 12px 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #logo-3d {
            width: 60px;
            height: 60px;
        }

        .header-title h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .header-title span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .badges {
            display: flex;
            gap: 6px;
        }

        .badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .badge-testnet { background: #15803d; color: #86efac; }
        .badge-mainnet { background: #1e293b; color: #64748b; }

        .btn-pi-auth {
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header h2 {
            font-size: 20px;
            color: #38bdf8;
        }

        .card-header p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .drop-zone {
            border: 2px dashed #334155;
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            background: rgba(15, 23, 42, 0.4);
            cursor: pointer;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .lang-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            border-radius: 12px;
            padding: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .lang-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: bold;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-blue { background: #0284c7; color: white; }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="header-left">
            <div id="logo-3d"></div>
            <div class="header-title">
                <h1>Universal Translator</h1>
                <span>theofintech.pi | by theo2280</span>
            </div>
        </div>
        <div class="header-right">
            <div class="badges">
                <span class="badge badge-testnet">Testnet</span>
                <span class="badge badge-mainnet">Mainnet</span>
            </div>
            <button class="btn-pi-auth" id="btn-connect" onclick="connectPi()">Π CONNEXION PI</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>📹 Universal Video Translator</h2>
            <p>Traduction vidéo multi-langues par IA agentique</p>
        </div>

        <div class="drop-zone">
            🎥 Déposer votre vidéo (MP4, AVI, MKV)
        </div>

        <div class="lang-grid">
            <button class="lang-btn active">🇺🇸 English</button>
            <button class="lang-btn">🇫🇷 Français</button>
            <button class="lang-btn">🇪🇸 Español</button>
        </div>

        <button class="btn-action btn-blue" onclick="triggerPiPayment('Traduction IA Agent')">🤖 TRADUIRE (1 PI)</button>
    </div>

</div>

<script>
    try {
        Pi.init({ version: "2.0", sandbox: true });
    } catch(e) { console.error("Pi SDK Init Error", e); }

    let currentUser = null;

    async function connectPi() {
        const btn = document.getElementById('btn-connect');
        try {
            const auth = await Pi.authenticate(['payments', 'username'], onIncompletePaymentFound);
            currentUser = auth.user.username;
            btn.innerText = "@" + currentUser;
        } catch (err) {
            console.error(err);
            alert("Erreur de connexion Pi Network");
        }
    }

    async function triggerPiPayment(memoText) {
        if (!currentUser) {
            await connectPi();
            if (!currentUser) return;
        }

        // Réveil préventif du serveur Render avant d'ouvrir le paiement Pi
        try {
            await fetch('https://universal-video-translator.onrender.com/');
        } catch(e) { console.log("Pré-réveil du serveur Render..."); }

        Pi.createPayment({
            amount: 1,
            memo: memoText || "Paiement Test Pi Developer",
            metadata: { type: "video_translation" }
        }, {
            onReadyForServerApproval: async function(paymentId) {
                console.log("Validation en cours sur Render pour paymentId:", paymentId);
                try {
                    const res = await fetch('https://universal-video-translator.onrender.com/api/approve', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId })
                    });
                    const data = await res.json();
                    console.log("Approbation OK:", data);
                } catch(e) {
                    console.error("Erreur approbation Render:", e);
                }
            },
            onReadyForServerCompletion: async function(paymentId, txid) {
                console.log("Completion TXID:", txid);
                try {
                    const res = await fetch('https://universal-video-translator.onrender.com/api/complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId, txid })
                    });
                    const data = await res.json();
                    alert("Succès ! Transaction validée : " + txid);
                } catch(e) {
                    console.error("Erreur completion Render:", e);
                }
            },
            onCancel: function(paymentId) {
                console.log("Paiement annulé", paymentId);
            },
            onError: function(error, payment) {
                console.error("Erreur paiement:", error);
            }
        });
    }

    function onIncompletePaymentFound(payment) {
        console.log("Paiement non complété :", payment);
    }

    // Graphic Three.js Logo
    const container = document.getElementById('logo-3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(60, 60);
    container.appendChild(renderer.domElement);

    const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 32), new THREE.MeshBasicMaterial({ color: 0x10b981 }));
    scene.add(sphere);
    camera.position.z = 5;

    function animate() {
        requestAnimationFrame(animate);
        sphere.rotation.y += 0.02;
        renderer.render(scene, camera);
    }
    animate();
</script>

</body>
</html>
