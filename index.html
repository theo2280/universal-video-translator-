<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Translator - Pi Web3</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; background: #0b0f19; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
        #canvas-container { width: 250px; height: 250px; margin-bottom: 20px; }
        .card { background: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-pi { background: #3b82f6; color: white; }
        .btn-pay { background: #a855f7; color: white; }
        .btn-file { background: #1e293b; color: #94a3b8; border: 1px dashed #334155; }
        #status { margin-top: 15px; font-size: 13px; color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div id="canvas-container"></div>
        <h2>Universal Video Translator</h2>

        <button class="btn-pi" onclick="connectPi()">π CONNEXION PI NETWORK</button>
        <button class="btn-file">📁 IMPORTER VIDÉO</button>
        <button class="btn-pay" onclick="triggerPiPayment()">🚀 PAYER 1 π & TRANSDUIRE</button>
        
        <div id="status">Statut: Prêt</div>
    </div>

    <script>
        // Initialisation Pi SDK
        try {
            Pi.init({ version: "2.0", sandbox: true });
        } catch(e) { console.log(e); }

        let currentUser = null;

        async function connectPi() {
            document.getElementById('status').innerText = "Connexion en cours...";
            try {
                const auth = await Pi.authenticate(['payments', 'username'], onIncompletePaymentFound);
                currentUser = auth.user.username;
                document.getElementById('status').innerText = "Connecté: @" + currentUser;
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "Erreur de connexion";
            }
        }

        async function triggerPiPayment() {
            if (!currentUser) {
                await connectPi();
            }
            
            document.getElementById('status').innerText = "Initialisation du paiement...";

            try {
                Pi.createPayment({
                    amount: 1,
                    memo: "Test de validation Developer Portal",
                    metadata: { type: "test_translation" }
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        console.log("Approval ID:", paymentId);
                        document.getElementById('status').innerText = "Paiement approuvé !";
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        console.log("Completed TXID:", txid);
                        document.getElementById('status').innerText = "Paiement réussi (TX: " + txid.substring(0,8) + "...)";
                        alert("Paiement effectué avec succès !");
                    },
                    onCancel: function(paymentId) {
                        document.getElementById('status').innerText = "Paiement annulé";
                    },
                    onError: function(error, payment) {
                        console.error(error);
                        document.getElementById('status').innerText = "Erreur paiement";
                    }
                });
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "Erreur lors du paiement";
            }
        }

        function onIncompletePaymentFound(payment) {
            console.log("Incomplete payment:", payment);
        }

        // Animation 3D Simple
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(250, 250);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
        const material = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);
        camera.position.z = 30;

        function animate() {
            requestAnimationFrame(animate);
            torusKnot.rotation.x += 0.01;
            torusKnot.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
