<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Video Translator</title>
  <!-- SDK Pi Network OBLIGATOIRE -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
    .plan-card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin: 10px auto; max-width: 300px; }
    button { background-color: #673ab7; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #512da8; }
  </style>
</head>
<body>

  <h1>Universal Video Translator</h1>
  <p>Choisissez votre formule d'abonnement pour traduire vos vidéos :</p>

  <!-- CARTES D'ABONNEMENT -->
  <div class="plan-card">
    <h3>Pass Mensuel</h3>
    <p>Accès illimité pendant 30 jours</p>
    <button onclick="lancerPaiementPi(1, 'Abonnement Mensuel Traduction Video')">S'abonner pour 1 Pi</button>
  </div>

  <div class="plan-card">
    <h3>Pass Annuel</h3>
    <p>Accès illimité pendant 1 an</p>
    <button onclick="lancerPaiementPi(10, 'Abonnement Annuel Traduction Video')">S'abonner pour 10 Pi</button>
  </div>

  <script>
  let currentUser = null;

  // 1. Initialisation SDK Mainnet
  Pi.init({ version: "2.0", sandbox: false });

  // 2. Authentification obligatoire
  async function authPi() {
    try {
      const scopes = ['username', 'payments'];
      function onIncompletePaymentFound(payment) {
        console.log("Paiement incomplet trouvé :", payment);
      }
      currentUser = await Pi.authenticate(scopes, onIncompletePaymentFound);
      console.log("Connecté :", currentUser.username);
    } catch (err) {
      console.error("Erreur d'authentification :", err);
    }
  }

  // Lancer au chargement
  authPi();

  // 3. Traitement des paiements
  function lancerPaiementPi(montant, description) {
    if (!currentUser) {
      alert("Veuillez patienter pendant l'authentification...");
      authPi();
      return;
    }

    Pi.createPayment({
      amount: montant,
      memo: description,
      metadata: { type: "subscription" }
    }, {
      // Étape 1 : Approbation par le serveur
      onReadyForServerApproval: function(paymentId) {
        fetch('/api/pi/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId: paymentId })
        })
        .then(res => res.json())
        .then(data => {
          if (data.error) alert("ERREUR APPROVAL: " + JSON.stringify(data.error));
          else console.log("Approuvé avec succès");
        })
        .catch(err => alert("Erreur réseau approval : " + err));
      },

      // Étape 2 : Complétion du paiement sur la blockchain (qui manquait !)
      onReadyForServerCompletion: function(paymentId, txid) {
        fetch('/api/pi/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId: paymentId, txid: txid })
        })
        .then(res => res.json())
        .then(data => {
          if (data.error) alert("ERREUR COMPLETION: " + JSON.stringify(data.error));
          else console.log("Complété avec succès");
        })
        .catch(err => alert("Erreur réseau completion : " + err));
      },

      onCancel: function(paymentId) {
        console.log("Paiement annulé :", paymentId);
      },
      onError: function(error, payment) {
        console.error("Erreur SDK :", error);
      }
    });
  }
</script>




</body>
</html>
